<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - BLUEWING</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="form-container">
  <h1>Criar conta</h1>
  <input type="text" id="cadastroNome" placeholder="Nome completo">
  <input type="email" id="cadastroEmail" placeholder="E-mail">
  <input type="password" id="cadastroSenha" placeholder="Senha">
  <label for="cadastroFoto" style="display:block;margin:8px 0;color:#ddd;font-size:14px;text-align:left;">Foto de perfil (opcional)</label>
  <input type="file" id="cadastroFoto" accept="image/*" style="width:100%;padding:6px;border-radius:6px;background:#0B0F3B;color:#fff;">
  <button id="cadastroBtn">Cadastrar</button>
  <p>Já tem conta? <a href="login.html">Entrar</a></p>
</main>
<script src="main.js"></script>
</body>
</html>
